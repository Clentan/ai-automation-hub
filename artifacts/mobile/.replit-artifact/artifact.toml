kind = "mobile"
previewPath = "/mobile/"
title = "Automation Hub Mobile"
description = "Native mobile companion for AI Automation Hub. Lets users sign in with Clerk, browse automation templates, toggle their flows, and check recent run activity against the existing FastAPI backend."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
