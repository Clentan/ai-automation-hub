kind = "web"
previewPath = "/"
title = "AI Automation Hub"
description = "A web app for browsing and managing AI automation templates. Users can search and filter a gallery of automation templates by category, view details, create their own flows from templates, and manage them from a My Flows dashboard."
version = "1.0.0"
id = "artifacts/automation-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24124

[services.development]
run = "pnpm --filter @workspace/automation-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/automation-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/automation-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24124"
BASE_PATH = "/"
